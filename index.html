html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

.rule{width:24px;height:1px;background:var(--line);margin:40px auto 18px}
.mail{font-size:14px;letter-spacing:.06em;color:var(--ink);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .2s}
.mail:hover,.mail:focus-visible{border-bottom-color:var(--ink);outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:400px){
  .slogan{flex-direction:column;--h:8.5px;gap:calc(var(--h) * 1.2);margin-top:22px}
}
@media (prefers-reduced-motion:no-preference){
  main>*{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
  .slogan{animation-delay:.15s} .rule,.mail{animation-delay:.3s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
